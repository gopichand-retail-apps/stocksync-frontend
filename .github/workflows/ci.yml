name: StockSync Frontend CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:cov
      - name: Report skipped cross-repository browser E2E
        run: echo "::notice::Playwright E2E is run from the local multi-root workspace because the sibling API repository is not checked out in this frontend-only workflow."
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev